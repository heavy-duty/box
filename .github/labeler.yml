# path → scope:* map for actions/labeler — the PR half of .ceremony/LABELS.md's scope
# story (issues are hand-scoped at triage; paths only exist on PRs). Additive
# only: sync-labels stays off in labels.yml, so a hand-applied scope survives.
"scope:cli":
  - changed-files:
      - any-glob-to-any-file: ["bin/**", "test/cli.sh"]
"scope:installer":
  - changed-files:
      - any-glob-to-any-file: ["install.sh"]
"scope:host":
  - changed-files:
      - any-glob-to-any-file: ["host/**"]
"scope:tiers":
  - changed-files:
      - any-glob-to-any-file:
          ["host/grant-user.sh", "host/revoke-user.sh", "drill/multiuser.sh"]
"scope:templates":
  - changed-files:
      - any-glob-to-any-file: ["templates/**", "profiles/**"]
# drill/ and drills/ are two directories, not a typo for one: drill/ is the
# rehearsal machinery (drill.sh, doctor.sh, RUNS.md) and drills/ is the run
# evidence (0.9.0.md, 0.9.1.md, …). Both definitions of this scope have always
# said "run evidence"; only the glob was short, so a PR whose whole diff is the
# next release's drill record landed with no scope at all (#275).
"scope:drill":
  - changed-files:
      - any-glob-to-any-file: ["drill/**", "drills/**"]
